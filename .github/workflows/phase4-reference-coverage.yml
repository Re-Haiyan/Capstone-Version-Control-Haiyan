name: Phase 4 reference packets (synthetic-only tests)
on:
  push:
    branches:
      - research/phase4-metrics-data-gate-20261115
  pull_request:
    branches:
      - feature/product-specific-conclusions
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safeguards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test blinded data preparation with synthetic reviews only
        run: |
          python -m unittest discover -s tests -p 'test_phase4_reference_packets.py' -v
      - name: Assert no reviewer packets were committed
        run: |
          test ! -e research/product_specific_conclusions/phase4/D3_reviewer_A_BLIND.csv
          test ! -e research/product_specific_conclusions/phase4/V3_reviewer_A_BLIND.csv
          test ! -e research/product_specific_conclusions/phase4/F2_SEALED_DO_NOT_OPEN.csv
