name: Phase 7 paired deployed vs candidate evaluation

on:
  push:
    branches:
      - research/xlmr-paired-compare-20261116
    paths:
      - "research/xlmr_optimization/phase7/compare_deployed_vs_candidate.py"
      - ".github/workflows/phase7-paired-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase7-paired-comparison
  cancel-in-progress: true

jobs:
  compare:
    name: Same reviews, same labels, actual deployed ONNX versus candidate
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile paired comparison
        run: python -m py_compile research/xlmr_optimization/phase7/compare_deployed_vs_candidate.py

      - name: Retrieve locked Phase 7 adapter and metrics
        uses: actions/download-artifact@v4
        with:
          run-id: 43734828440
          github-token: ${{ github.token }}
          name: phase7-xlmr-research-candidate
          path: ${{ runner.temp }}/phase7-model

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install exact tokenizer, ONNX and metric dependencies
        run: |
          python -m pip install \
            "numpy>=1.26,<2" "scikit-learn>=1.4,<1.7" \
            "transformers==4.46.3" "safetensors>=0.4,<0.6" \
            "sentencepiece==0.2.0" "protobuf>=4.25,<6" \
            "onnxruntime==1.20.1" "tokenizers>=0.20,<0.21" \
            "joblib>=1.4,<2"

      - name: Score both exact artifacts on identical 50 reviews
        run: |
          python research/xlmr_optimization/phase7/compare_deployed_vs_candidate.py \
            --artifact-dir "$RUNNER_TEMP/phase7-model" \
            --output-dir "$RUNNER_TEMP/phase7-paired"

      - name: Upload aggregate comparison only, no customer review text
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-paired-comparison
          path: ${{ runner.temp }}/phase7-paired/paired_comparison.json
          retention-days: 30
          if-no-files-found: error
