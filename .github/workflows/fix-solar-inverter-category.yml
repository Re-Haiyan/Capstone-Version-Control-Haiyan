name: Solar inverter category regression

on:
  push:
    branches:
      - fix/solar-inverter-category-20261116
  pull_request:
    branches:
      - deployment

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m nltk.downloader vader_lexicon
      - name: Test category distinction and saved-report correction
        env:
          PYTHONPATH: backend:backend/sentiment-analysis
        run: |
          python -m unittest discover -s tests -p 'test_solar_inverter_category.py' -v
          python -m unittest discover -s tests -p 'test_product_category.py' -q
          python -m unittest discover -s tests -p 'test_category_wording.py' -q
          python -m unittest discover -s tests -p 'test_release_version.py' -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend dependencies
        run: |
          npm install -g npm@11
          npm ci --no-audit --no-fund
      - name: Check frontend and production build
        run: |
          npm run check
          npm run build
