name: Feature branch regression (no deployment)
on:
  push:
    branches:
      - feature/category-accuracy-20261115
      - feature/product-specific-conclusions
  pull_request:
    branches:
      - feature/product-specific-conclusions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-regression:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m nltk.downloader vader_lexicon
      - name: Initialize documented starter database for compatibility tests
        run: python scripts/load_starter_data.py
      - name: Run backend tests
        env:
          PYTHONPATH: backend:backend/sentiment-analysis
        run: python -m unittest discover -s tests -p "test_*.py" -q

  frontend:
    name: Svelte check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact lockfile dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify dependency manifests were not changed by install
        run: git diff --exit-code -- package.json package-lock.json
      - name: Svelte and TypeScript checks
        run: npm run check
      - name: Frontend build
        run: npm run build
      - name: Browser extension unit tests
        run: npm run test:extension

  existing-review-audit:
    name: Real saved-review and title comparison
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m nltk.downloader vader_lexicon
      - name: Compare saved review snapshots against unmodified parent
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/defaketive-baseline" a5ea4de7c4a2585d597042015b9ac0e0be7f341a
          python research/product_specific_conclusions/category_upgrade_audit.py --source-root "$RUNNER_TEMP/defaketive-baseline" --output "$RUNNER_TEMP/before.json" > /dev/null
          python research/product_specific_conclusions/category_upgrade_audit.py --source-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/after.json" > /dev/null
          python research/product_specific_conclusions/category_upgrade_audit.py --compare "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" --output "$RUNNER_TEMP/comparison.json" > /dev/null
          python -c 'import json,os; x=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"comparison.json"))); print({k:(len(v) if isinstance(v,list) else v) for k,v in x.items() if k != "limits"})'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: category-review-audit
          path: |
            ${{ runner.temp }}/before.json
            ${{ runner.temp }}/after.json
            ${{ runner.temp }}/comparison.json
          if-no-files-found: warn

  safety-source-audit:
    name: Source-linked hazard QA (non-deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Operates only on the historical frozen evaluation pack. This job
      # NEVER updates or trains the shipped hazard model.
      - name: Rebuild source-linked review queue
        shell: bash
        run: |
          set -euo pipefail
          python research/product_specific_conclusions/ai_annotation/safety_source_audit.py \
            --out-json "$RUNNER_TEMP/safety_source_audit.json" \
            --out-csv "$RUNNER_TEMP/safety_source_audit.csv"
          python -m unittest discover -s tests -p "test_safety_source_audit.py" -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-linked-hazard-review-queue
          path: |
            ${{ runner.temp }}/safety_source_audit.json
            ${{ runner.temp }}/safety_source_audit.csv
          if-no-files-found: warn
