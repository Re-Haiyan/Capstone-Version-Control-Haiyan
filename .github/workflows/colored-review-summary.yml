name: Review summary and colored report cards

on:
  push:
    branches:
      - feature/colored-review-summary-20261116
    paths:
      - "src/lib/components/report/verdict-block.svelte"
      - "src/lib/review-summary.js"
      - "tests/review-summary.test.mjs"
      - ".github/workflows/colored-review-summary.yml"
  pull_request:
    branches:
      - deployment

permissions:
  contents: read

jobs:
  validate:
    name: Summary safety tests, Svelte typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install project dependencies
        run: |
          npm install -g npm@11
          npm ci --no-audit --no-fund
      - name: Verify summary behavior and evidence-backed highlights
        run: |
          node --test tests/review-summary.test.mjs tests/positive-highlights.test.mjs
      - name: Svelte typecheck
        run: npm run check
      - name: Compile production frontend
        run: npm run build
