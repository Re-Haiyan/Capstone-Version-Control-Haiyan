# Temporary repair workflow. Remove once the lockfile has been committed.
# Deliberately constrained to the same-repository PR branch only.
name: Temporary lockfile repair (non-deployment)
on:
  pull_request:
    branches:
      - feature/product-specific-conclusions
    paths:
      - .github/workflows/temporary-lockfile-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ci/combined-tip-reproducible-build-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/combined-tip-reproducible-build-20261115
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Re-resolve exact lockfile metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Prove clean installation
        run: npm ci --no-audit --no-fund
      - name: Restrict mutation to package-lock.json
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          git diff --stat -- package-lock.json
          git add -- package-lock.json
          if ! git diff --cached --quiet; then
            test "$(git diff --cached --name-only)" = "package-lock.json"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: reconcile frontend lockfile for npm ci"
            git push origin HEAD:refs/heads/ci/combined-tip-reproducible-build-20261115
          fi
