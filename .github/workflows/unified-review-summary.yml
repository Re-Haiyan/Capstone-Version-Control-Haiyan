name: One clear review summary for every verdict

on:
  push:
    branches:
      - feature/unified-evidence-review-summary-all-labels-20261116
    paths:
      - "src/lib/review-guidance.js"
      - "src/lib/components/report/verdict-block.svelte"
      - "src/lib/components/report/report-view.svelte"
      - "tests/review-guidance.test.mjs"
      - "tests/report-verdict-unified-headings.test.mjs"
      - ".github/workflows/unified-review-summary.yml"
  pull_request:
    branches:
      - deployment

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked packages
        run: |
          npm install -g npm@11
          npm ci --no-audit --no-fund
      - name: Test every report status and review count
        run: |
          node --test tests/review-guidance.test.mjs tests/report-verdict-unified-headings.test.mjs tests/positive-highlights.test.mjs tests/report-visible-fields.test.mjs
      - name: Svelte typecheck
        run: npm run check
      - name: Frontend production build
        run: npm run build
