name: Phase 5B lexical sensitivity (research only)
on:
  push:
    branches:
      - research/phase5b-sensitivity-cv
  pull_request:
    branches:
      - research/neutral-phase2
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.5.2
      - name: Unit tests for data separation
        run: |
          python -m unittest discover -s tests -p 'test_phase5b_sensitivity.py' -v
          python -m unittest discover -s tests -p 'test_phase5_training_manifest.py' -v
      - name: Run all three fixed-seed text-only comparisons
        run: |
          python research/xlmr_optimization/phase5/phase5b_sensitivity.py --out-dir /tmp/phase5b-results --seeds 11 12 13
      - name: Save aggregate metrics without customer review texts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5b-lexical-sensitivity
          path: /tmp/phase5b-results/
          if-no-files-found: warn
