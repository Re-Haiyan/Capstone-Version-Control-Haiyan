name: Review highlights UI checks

on:
  push:
    branches:
      - feature/review-positive-highlights-20261116
    paths:
      - "src/lib/positive-highlights.js"
      - "src/lib/components/report/**"
      - "tests/positive-highlights.test.mjs"
      - ".github/workflows/review-highlights-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Static typecheck, unit tests, and frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install build dependencies
        run: |
          npm install -g npm@11
          npm ci --no-audit --no-fund
      - name: Check evidence selection
        run: node --test tests/positive-highlights.test.mjs
      - name: Type and Svelte structure checks
        run: npm run check
      - name: Build app
        run: npm run build
