name: Hazard Checker 80 research checks (no deployment)

on:
  push:
    branches:
      - research/hazard-80-quality-20261116
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hazard-regression:
    name: Hazard Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m nltk.downloader vader_lexicon
      - name: Independent synthetic scoring-gate checks
        run: python -m unittest discover -s tests -p "test_hazard_80_gate.py" -v
      - name: Targeted safety regression
        env:
          PYTHONPATH: backend:backend/sentiment-analysis
        run: |
          python -m unittest discover -s tests -p "test_safety_multi_mention.py" -v
          python -m unittest discover -s tests -p "test_safety_s5.py" -v
          python -m unittest discover -s tests -p "test_safety_regression.py" -v
      - name: Initialize starter database
        run: python scripts/load_starter_data.py
      - name: Full existing Python suite
        env:
          PYTHONPATH: backend:backend/sentiment-analysis
        run: python -m unittest discover -s tests -p "test_*.py" -q

  code-safety:
    name: Compile new standalone gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and run pure-Python gate tests
        run: |
          python -m py_compile research/hazard_80_gate.py research/hazard_predict.py tests/test_hazard_80_gate.py
          python -m unittest discover -s tests -p "test_hazard_80_gate.py" -v
