name: Splash Explore CTA validation

on:
  push:
    branches:
      - feature/prominent-explore-splash-cta-20261116
    paths:
      - "src/lib/components/app/splash.svelte"
      - "tests/splash-explore-cta.test.mjs"
      - ".github/workflows/splash-cta-validation.yml"
  pull_request:
    branches:
      - deployment

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          npm install -g npm@11
          npm ci --no-audit --no-fund
      - name: Check the call-to-action behavior and accessibility affordances
        run: node --test tests/splash-explore-cta.test.mjs
      - name: Svelte typecheck and accessibility warnings
        run: npm run check
      - name: Production frontend build
        run: npm run build
