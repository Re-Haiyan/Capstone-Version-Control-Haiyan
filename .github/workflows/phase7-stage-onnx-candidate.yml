name: Phase 7 research ONNX export and staging diagnostics

on:
  push:
    branches:
      - research/phase7-staging-export-20261116
    paths:
      - "research/xlmr_optimization/phase7/export_staging_onnx.py"
      - ".github/workflows/phase7-stage-onnx-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase7-stage-onnx-export
  cancel-in-progress: true

jobs:
  staging-export:
    name: Export and validate research candidate (no VM changes)
    runs-on: ubuntu-latest
    timeout-minutes: 140
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download frozen Phase 7 research weights
        uses: actions/download-artifact@v4
        with:
          run-id: 43734828440
          github-token: ${{ github.token }}
          name: phase7-xlmr-research-candidate
          path: ${{ runner.temp }}/phase7-original
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install conversion, inference and evaluation dependencies
        run: |
          python -m pip install "numpy>=1.26,<2" "scikit-learn>=1.4,<1.7" \
            "transformers==4.46.3" "safetensors>=0.4,<0.6" \
            "sentencepiece==0.2.0" "protobuf>=4.25,<6" "onnx==1.17.0" \
            "onnxruntime==1.20.1" "tokenizers>=0.20,<0.21" "psutil>=5.9,<8"
      - name: Export and test Phase 7 ONNX, explicitly research-only
        run: |
          python research/xlmr_optimization/phase7/export_staging_onnx.py \
            --artifact "$RUNNER_TEMP/phase7-original" \
            --output "$RUNNER_TEMP/phase7-staging"
      - name: Measure isolated ONNX-only CPU memory and latency with synthetic inputs
        run: |
          python research/xlmr_optimization/phase7/benchmark_staging_onnx.py \
            --candidate "$RUNNER_TEMP/phase7-staging"
      - name: Enforce NOT release eligible and required outputs
        run: |
          python - <<'PY'
          import json,os,pathlib
          d=pathlib.Path(os.environ["RUNNER_TEMP"])/"phase7-staging"
          m=json.loads((d/"manifest.json").read_text())
          assert m["eligible_for_deployment"] is False
          assert m["qualified_for_integration"] is False
          assert m["outputs"]==["logits","hidden_states"]
          assert m["diagnostics"]["num_reviews"]==50
          assert (d/"model.onnx").stat().st_size>100_000_000
          print("Research artifact only. NO VM deployment. NO independent 80% claim.")
          PY
      - name: Upload research candidate and aggregate diagnostics (no review text)
        uses: actions/upload-artifact@v4
        with:
          name: phase7-onnx-research-staging-only
          path: |
            ${{ runner.temp }}/phase7-staging/model.onnx
            ${{ runner.temp }}/phase7-staging/tokenizer.json
            ${{ runner.temp }}/phase7-staging/manifest.json
            ${{ runner.temp }}/phase7-staging/isolated_cpu_benchmark.json
          retention-days: 7
          if-no-files-found: error
