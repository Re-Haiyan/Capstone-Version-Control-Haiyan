name: Generalized concern labels validation

on:
  push:
    branches:
      - feature/generalized-concern-wording-20261118
  pull_request:
    branches:
      - deployment

permissions:
  contents: read

jobs:
  unchanged_detection:
    name: Hazard and sentiment engines unchanged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure no model, taxonomy, weights, or DB changes
        run: |
          set -euo pipefail
          BASE=40aa8c6d2506f17aa2ecb695a1af47023257f9c1
          git cat-file -e "${BASE}^{commit}"
          test -z "$(git diff --name-only "$BASE" HEAD -- backend/sentiment-analysis backend/category_copy.py backend/requirements.txt scripts/requirements-lock.txt backend/defaketive.db package-lock.json)"
          echo "Sentiment model, hazard flags, detection rules, database and dependencies unchanged."
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install requirements and starter data
        run: |
          python -m pip install -r backend/requirements.txt
          python -m nltk.downloader vader_lexicon
          python scripts/load_starter_data.py
      - name: Run concern wording and existing category-check regression
        env:
          PYTHONPATH: backend:backend/sentiment-analysis
        run: |
          python -m unittest discover -s tests -p 'test_general_concern_wording.py' -v
          python -m unittest discover -s tests -p 'test_category_wording.py' -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test report and build
        run: |
          npm ci --no-fund --no-audit
          node --test tests/generalized-concern-labels.test.mjs tests/report-verdict-unified-headings.test.mjs tests/product-category-label.test.mjs
          npm run check
          npm run build
