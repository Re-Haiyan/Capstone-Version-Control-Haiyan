name: Clean Review Summary (UI only)

on:
  push:
    branches: [fix/remove-context-debug-from-summary-20261118]
  pull_request:
    branches: [deployment]

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Summary, categories and panel flow test
        run: |
          node --test tests/category-context-summary.test.mjs tests/report-verdict-unified-headings.test.mjs tests/report-visible-fields.test.mjs
          npm run check
          npm run build
      - name: No backend, classifier, data, or context aggregation edits
        if: github.head_ref != 'feature/product-category-label-audit'
        env:
          BASE: ${{ github.event.pull_request.base.sha || '38b551ae60bbe7cf84bc7d1518fbfee88442a38f' }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASE}^{commit}"
          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          printf '%s\n' "$CHANGED"
          test -z "$(git diff --name-only "$BASE" HEAD -- backend/ research/ deploy/ src/lib/category-context-summary.js)"
