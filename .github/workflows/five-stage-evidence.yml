name: Five-stage evidence regression
on:
  push:
    branches: [feature/five-stage-evidence-4eab8ea, feature/fan-concern-precision-23b1090]
  pull_request:
    branches: [feature/validated-category-release-ed91291]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: backend:backend/sentiment-analysis
      OMP_NUM_THREADS: '1'
      DEFAKETIVE_SENTIMENT_CALIBRATOR: ''
      DEFAKETIVE_CATEGORY_SENTIMENT_SHADOW: ''
      DEFAKETIVE_CATEGORY_SENTIMENT_ADAPTER: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify baseline and unchanged model, sentiment, database and deployment code
        run: |
          git merge-base --is-ancestor 4eab8ea1b3d7ffa7660343a82cfe969436cbd80b HEAD
          git diff --exit-code 4eab8ea1b3d7ffa7660343a82cfe969436cbd80b HEAD -- backend/sentiment-analysis/models backend/sentiment-analysis/defaketive_sentiment/model.py backend/sentiment-analysis/defaketive_sentiment/category_sentiment.py backend/sentiment-analysis/defaketive_sentiment/sentiment_calibration.py backend/requirements.txt backend/data_store.py deploy/ serve.py server.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run check
      - run: npm run build
      - run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m nltk.downloader vader_lexicon
      - run: python -m unittest discover -s tests
